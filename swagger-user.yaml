openapi: 3.0.0
info:
  title: HR & Product System - Project & Task API
  description: API documentation for Project and Task modules.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

paths:
  # ─── PROJECT MODULE ─────────────────────────────────────────────────────────
  /api/projects:
    get:
      tags:
        - Projects
      summary: List projects
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of projects retrieved successfully

    post:
      tags:
        - Projects
      summary: Create project (Admin/GM only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectDto"
      responses:
        "201":
          description: Project created successfully

  /api/projects/{id}:
    get:
      tags:
        - Projects
      summary: Get project details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details retrieved successfully

    patch:
      tags:
        - Projects
      summary: Update project (Admin/GM or Team Leader)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectDto"
      responses:
        "200":
          description: Project updated successfully

    delete:
      tags:
        - Projects
      summary: Delete project (Admin/GM only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project deleted successfully

  /api/projects/{id}/members:
    get:
      tags:
        - Projects
      summary: Get project members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of members retrieved successfully

    post:
      tags:
        - Projects
      summary: Add member to project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
              properties:
                employeeId:
                  type: string
      responses:
        "200":
          description: Member added successfully

  /api/projects/{id}/members/{employeeId}:
    delete:
      tags:
        - Projects
      summary: Remove member from project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed successfully

  # ─── TASK MODULE ────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      description: List tasks (projectId is required for non-admin users).
      parameters:
        - in: query
          name: projectId
          schema:
            type: string
          description: ID of the project to filter tasks
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of tasks retrieved successfully

    post:
      tags:
        - Tasks
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskDto"
      responses:
        "201":
          description: Task created successfully

  /api/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details retrieved successfully

    patch:
      tags:
        - Tasks
      summary: Update task (Update details or status)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskDto"
      responses:
        "200":
          description: Task updated successfully

    delete:
      tags:
        - Tasks
      summary: Delete task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task deleted successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateProjectDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        teamLeaderId:
          type: string
        taskCreationPolicy:
          type: string
          enum: [leader_only, all_members]
          default: leader_only

    UpdateProjectDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        teamLeaderId:
          type: string
        taskCreationPolicy:
          type: string
          enum: [leader_only, all_members]

    CreateTaskDto:
      type: object
      required:
        - projectId
        - title
      properties:
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
        dueDate:
          type: string
          format: date

    UpdateTaskDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [todo, in_progress, completed, cancelled]
