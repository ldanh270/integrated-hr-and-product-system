<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRP Login</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
            display: block;
        }

        .alert.success {
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
            display: block;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="login-container" id="login-form-container">
    <div class="header">
        <h1>Welcome Back</h1>
        <p>Please log in to continue</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn">Sign In</button>
    </form>
</div>

<div class="login-container hidden" id="success-container">
    <div class="header" style="margin-bottom: 0;">
        <svg style="width: 48px; height: 48px; color: var(--success); margin: 0 auto 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h1>Login Successful!</h1>
        <p style="margin-top: 0.5rem;">You can now close this window and return to the AI assistant.</p>
    </div>
</div>

<script>
    // Get loginId from URL query params
    const urlParams = new URLSearchParams(window.location.search);
    const loginId = urlParams.get('id');

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');
    const formContainer = document.getElementById('login-form-container');
    const successContainer = document.getElementById('success-container');

    if (!loginId) {
        showAlert('Missing login ID. Please start the login process from the AI assistant again.', 'error');
        form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Reset state
        showAlert('', '');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
            // Derive the submit URL from the current page URL so it works whether
            // the server is mounted at root (e.g. /auth/login) or under a sub-path
            // (e.g. /mcp/auth/login when behind ngrok/nginx with a path prefix).
            const submitUrl = window.location.pathname.replace(/\/auth\/login.*$/, '/auth/submit');
            const response = await fetch(submitUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    loginId,
                    username,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to login');
            }

            // Success
            formContainer.classList.add('hidden');
            successContainer.classList.remove('hidden');

        } catch (error) {
            showAlert(error.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });

    function showAlert(message, type) {
        if (!message) {
            alertBox.className = 'alert hidden';
            return;
        }
        alertBox.textContent = message;
        alertBox.className = `alert ${type}`;
    }
</script>

</body>
</html>
