openapi: 3.0.0
info:
  title: HR Management System API
  description: API for managing employees and authentication in the HR Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      description: Check if the server is running.
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Connect to server successfully

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate a user and return a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Invalid input (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (invalid credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Log out the current user and record the activity.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logout successful
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/employees:
    get:
      tags:
        - Employees
      summary: List Employees
      description: Retrieve a paginated list of all employees.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by name, email, or username
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/EmployeeRole'
        - in: query
          name: employeeType
          schema:
            $ref: '#/components/schemas/EmployeeType'
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaginatedEmployeesResponse'
                  error:
                    type: string
                    nullable: true
                    example: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Employees
      summary: Create Employee
      description: Create a new employee (admin, manager only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeDto'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'
                  error:
                    type: string
                    nullable: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/employees/{id}:
    get:
      tags:
        - Employees
      summary: Get Employee
      description: Get an employee by ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'
                  error:
                    type: string
                    nullable: true
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Employees
      summary: Update Employee
      description: Partially update an employee (admin, manager only).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeDto'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'
                  error:
                    type: string
                    nullable: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/employees/{id}/status:
    patch:
      tags:
        - Employees
      summary: Update Employee Status
      description: Update just the status of an employee, e.g. for soft delete to 'terminated' (admin, manager only).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusDto'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'
                  error:
                    type: string
                    nullable: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/me:
    get:
      tags:
        - Profile
      summary: Get my profile
      description: Returns the full profile of the currently authenticated employee.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Profile
      summary: Update my profile
      description: |
        Updates editable fields on the authenticated user's profile.
        Only provided fields are updated (partial update).
        Read-only fields (username, email, role, status, employeeType) cannot be changed here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/me/avatar:
    post:
      tags:
        - Profile
      summary: Upload avatar
      description: |
        Uploads a new profile avatar image using multipart/form-data.
        - Field name: **avatar**
        - Accepted types: JPEG, PNG, WEBP, GIF
        - Max size: 5 MB
        - Image is resized to 400×400 and converted to WebP via Cloudinary.
        - Previous avatar is automatically deleted from Cloudinary.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (JPEG / PNG / WEBP / GIF, max 5 MB)
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '400':
          description: No file provided or invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ─── ATTENDANCE MODULE ──────────────────────────────
  /api/shifts:
    get:
      tags: [Shifts]
      summary: List all working shifts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of shifts
    post:
      tags: [Shifts]
      summary: Create a working shift
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Shift created

  /api/shifts/{id}:
    get:
      tags: [Shifts]
      summary: Get shift by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shift data
    patch:
      tags: [Shifts]
      summary: Update shift
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shift updated

  /api/schedules/employee/{employeeId}:
    get:
      tags: [Schedules]
      summary: Get employee schedule for a date
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: Schedule data

  /api/schedules/assign:
    post:
      tags: [Schedules]
      summary: Assign weekly schedule to employee
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Schedule assigned

  /api/schedules/override:
    post:
      tags: [Schedules]
      summary: Override shift for a specific date
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Shift overridden

  /api/attendance:
    get:
      tags: [Attendance]
      summary: Query attendance records
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of attendance records

  /api/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check in
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Checked in successfully

  /api/attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check out
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Checked out successfully

  /api/applications:
    post:
      tags: [Applications]
      summary: Submit a leave/overtime application
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Application submitted

  /api/applications/employee/{employeeId}:
    get:
      tags: [Applications]
      summary: Get employee applications
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of applications

  /api/applications/{id}/approve:
    patch:
      tags: [Applications]
      summary: Approve or reject application
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Application processed

  /api/holidays:
    post:
      tags: [Holidays]
      summary: Create a holiday
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Holiday created

  /api/holidays/check:
    get:
      tags: [Holidays]
      summary: Check if date is a holiday
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: True if holiday

  /api/approvals:
    get:
      tags: [Approvals]
      summary: List pending approvals
      description: Retrieve all pending requests (applications, password resets, proposals) that the current user has the authority to approve.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of pending approvals retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalItem'
                  error:
                    type: string
                    nullable: true

  /api/approvals/{category}/{id}:
    patch:
      tags: [Approvals]
      summary: Process an approval request
      description: Approve or reject a specific request by its category and ID.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [application, password_reset, recruitment_proposal]
          description: The category of the request
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The request document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessApprovalDto'
      responses:
        '200':
          description: Request approved or rejected successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  error:
                    type: string
                    nullable: true
        '400':
          description: Validation error or request already processed.
        '403':
          description: Forbidden - User does not have permission to approve this request.
        '404':
          description: Request not found.

  # ─── PAYROLL MODULE ──────────────────────────────
  /api/salary-components:
    get:
      tags: [Payroll]
      summary: List salary components
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of salary components
    post:
      tags: [Payroll]
      summary: Create a salary component
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Salary component created

  /api/salary-components/{id}:
    put:
      tags: [Payroll]
      summary: Update a salary component
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Salary component updated
    delete:
      tags: [Payroll]
      summary: Delete a salary component
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Salary component deleted

  /api/salary-components/validate:
    post:
      tags: [Payroll]
      summary: Validate a mathjs formula
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Formula is valid
        '400':
          description: Formula is invalid

  /api/payslip-templates:
    get:
      tags: [Payroll]
      summary: List payslip templates
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of payslip templates
    post:
      tags: [Payroll]
      summary: Create a payslip template
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Payslip template created

  /api/payslip-templates/{id}:
    put:
      tags: [Payroll]
      summary: Update a payslip template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payslip template updated
    delete:
      tags: [Payroll]
      summary: Delete a payslip template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Payslip template deleted

  /api/employees/{id}/salary-config:
    get:
      tags: [Payroll]
      summary: Get active salary config for an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active salary config
    post:
      tags: [Payroll]
      summary: Assign a new salary config to an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Salary config assigned

  /api/employees/{id}/salary-config/history:
    get:
      tags: [Payroll]
      summary: Get salary config history for an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of past salary configs

  /api/payrolls/my/payslips:
    get:
      tags: [Payroll]
      summary: Get my payslips (Employee)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of payslips for the authenticated user

  /api/payrolls:
    get:
      tags: [Payroll]
      summary: List all payrolls
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of payrolls

  /api/payrolls/generate:
    post:
      tags: [Payroll]
      summary: Generate payroll for a month
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Payroll generated

  /api/payrolls/{id}/approve:
    post:
      tags: [Payroll]
      summary: Approve a payroll
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payroll approved

  /api/payrolls/{id}/reject:
    post:
      tags: [Payroll]
      summary: Reject a payroll
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payroll rejected

  /api/payrolls/{id}/payslips/{empId}:
    get:
      tags: [Payroll]
      summary: Get a specific payslip
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: empId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payslip details

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: password123

    AuthResponseDto:
      type: object
      properties:
        token:
          type: string
        employee:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            fullName:
              type: string
            role:
              $ref: '#/components/schemas/EmployeeRole'

    Employee:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/EmployeeRole'
        phone:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        dateOfBirth:
          type: string
          format: date
          nullable: true
        nationalId:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        avatar:
          type: object
          properties:
            url:
              type: string
              nullable: true
            id:
              type: string
              nullable: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedEmployeesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer

    CreateEmployeeDto:
      type: object
      required:
        - fullName
        - email
        - username
        - password
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
        role:
          $ref: '#/components/schemas/EmployeeRole'
        phone:
          type: string
        position:
          type: string
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        dateOfBirth:
          type: string
          format: date
        nationalId:
          type: string
        address:
          type: string
        startDate:
          type: string
          format: date

    UpdateEmployeeDto:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        position:
          type: string
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        dateOfBirth:
          type: string
          format: date
        nationalId:
          type: string
        address:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UpdateStatusDto:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/EmployeeStatus'

    EmployeeRole:
      type: string
      enum: [admin, manager, employee]

    EmployeeType:
      type: string
      enum: [full_time, part_time, contractor, intern]

    EmployeeStatus:
      type: string
      enum: [active, inactive, on_leave, terminated]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    ProfileDto:
      type: object
      properties:
        id:
          type: string
          example: 6650a1b2c3d4e5f6a7b8c9d0
        fullName:
          type: string
          example: Nguyễn Văn An
        username:
          type: string
          example: an.nguyen
        email:
          type: string
          format: email
          example: an.nguyen@company.com
        phone:
          type: string
          nullable: true
          example: '0901234567'
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '1995-06-15'
        nationalId:
          type: string
          nullable: true
          example: '001095012345'
        address:
          type: string
          nullable: true
          example: 123 Đường Lê Lợi, Q1, TP.HCM
        position:
          type: string
          nullable: true
          example: Senior Developer
        role:
          $ref: '#/components/schemas/EmployeeRole'
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        startDate:
          type: string
          format: date
          nullable: true
          example: '2023-01-15'
        avatar:
          type: object
          properties:
            url:
              type: string
              nullable: true
              example: 'https://res.cloudinary.com/xxx/image/upload/v1/hrp/avatars/avatar_abc.webp'
            id:
              type: string
              nullable: true
              example: hrp/avatars/avatar_abc
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileDto:
      type: object
      description: All fields are optional. Only provided fields will be updated.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyễn Văn An
        phone:
          type: string
          example: '0901234567'
        dateOfBirth:
          type: string
          format: date
          example: '1995-06-15'
        nationalId:
          type: string
          minLength: 9
          maxLength: 20
          example: '001095012345'
        address:
          type: string
          maxLength: 500
          example: 123 Đường Lê Lợi, Q1, TP.HCM

    Application:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        type:
          type: string
          enum: [leave, overtime, work_from_home, shift_swap, business_trip, maternity, paternity, sick]
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        reason:
          type: string
        employeeShiftId:
          type: string
          nullable: true
          description: Linked to a specific generated shift
        workingShiftId:
          type: string
          nullable: true
          description: Linked to a shift template
        regimeType:
          type: string
          enum: [paid, unpaid]
          nullable: true

    PayrollComponent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [addition, deduction]
        formula:
          type: string
          example: "contract_salary"
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PayrollTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        components:
          type: array
          items:
            type: object
            properties:
              componentId:
                type: string
              formula:
                type: string
              overrideFormula:
                type: string
                nullable: true

    ApprovalItem:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [application, password_reset, recruitment_proposal]
        employeeId:
          type: string
        employeeName:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        details:
          type: object

    ProcessApprovalDto:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [approved, rejected]
        rejectReason:
          type: string
          nullable: true
          example: "Không đúng quy trình hoặc lý do chưa thuyết phục"
