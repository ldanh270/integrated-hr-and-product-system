openapi: 3.0.0
info:
  title: HR Management System API
  description: API for managing employees and authentication in the HR Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      description: Check if the server is running.
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Connect to server successfully

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate a user and return a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Invalid input (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (invalid credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Log out the current user and record the activity.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logout successful
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/employees:
    get:
      tags:
        - Employees
      summary: List Employees
      description: Retrieve a list of all employees.
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  error:
                    type: string
                    nullable: true
                    example: null

  /api/profile/me:
    get:
      tags:
        - Profile
      summary: Get my profile
      description: Returns the full profile of the currently authenticated employee.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Profile
      summary: Update my profile
      description: |
        Updates editable fields on the authenticated user's profile.
        Only provided fields are updated (partial update).
        Read-only fields (username, email, role, status, employeeType) cannot be changed here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/me/avatar:
    post:
      tags:
        - Profile
      summary: Upload avatar
      description: |
        Uploads a new profile avatar image using multipart/form-data.
        - Field name: **avatar**
        - Accepted types: JPEG, PNG, WEBP, GIF
        - Max size: 5 MB
        - Image is resized to 400×400 and converted to WebP via Cloudinary.
        - Previous avatar is automatically deleted from Cloudinary.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (JPEG / PNG / WEBP / GIF, max 5 MB)
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/ProfileDto'
        '400':
          description: No file provided or invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: password123

    AuthResponseDto:
      type: object
      properties:
        token:
          type: string
        employee:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            fullName:
              type: string
            role:
              $ref: '#/components/schemas/EmployeeRole'

    Employee:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/EmployeeRole'
        phone:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmployeeRole:
      type: string
      enum: [admin, manager, employee]

    EmployeeType:
      type: string
      enum: [full_time, part_time, contractor, intern]

    EmployeeStatus:
      type: string
      enum: [active, inactive, on_leave, terminated]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    ProfileDto:
      type: object
      properties:
        id:
          type: string
          example: 6650a1b2c3d4e5f6a7b8c9d0
        fullName:
          type: string
          example: Nguyễn Văn An
        username:
          type: string
          example: an.nguyen
        email:
          type: string
          format: email
          example: an.nguyen@company.com
        phone:
          type: string
          nullable: true
          example: '0901234567'
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '1995-06-15'
        nationalId:
          type: string
          nullable: true
          example: '001095012345'
        address:
          type: string
          nullable: true
          example: 123 Đường Lê Lợi, Q1, TP.HCM
        position:
          type: string
          nullable: true
          example: Senior Developer
        role:
          $ref: '#/components/schemas/EmployeeRole'
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        startDate:
          type: string
          format: date
          nullable: true
          example: '2023-01-15'
        avatar:
          type: object
          properties:
            url:
              type: string
              nullable: true
              example: 'https://res.cloudinary.com/xxx/image/upload/v1/hrp/avatars/avatar_abc.webp'
            id:
              type: string
              nullable: true
              example: hrp/avatars/avatar_abc
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileDto:
      type: object
      description: All fields are optional. Only provided fields will be updated.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyễn Văn An
        phone:
          type: string
          example: '0901234567'
        dateOfBirth:
          type: string
          format: date
          example: '1995-06-15'
        nationalId:
          type: string
          minLength: 9
          maxLength: 20
          example: '001095012345'
        address:
          type: string
          maxLength: 500
          example: 123 Đường Lê Lợi, Q1, TP.HCM
