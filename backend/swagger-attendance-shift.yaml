openapi: 3.0.0
info:
  title: Attendance & Shift API
  description: API for attendance tracking and shift management
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Working Shifts
    description: Manage working shifts (HR Manager+)
  - name: Schedules
    description: Assign and view shift schedules
  - name: Attendance
    description: Check-in / check-out tracking
  - name: Shift Change Requests
    description: Submit and view shift swap requests
  - name: Approvals
    description: Approve or reject requests

paths:
  # ─── WORKING SHIFTS ──────────────────────────────────────────

  /api/shifts:
    get:
      tags: [Working Shifts]
      summary: List all working shifts
      description: All authenticated employees can view.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"
              example:
                data:
                  - id: "cmq6shgpv0006f4eqeu867c34"
                    name: "Morning Shift"
                    startTime: 480
                    endTime: 1020
                    gracePeriodMinutes: 15
                    gpsLat: 10.7769
                    gpsLng: 106.7009
                    gpsRadiusMeters: 100
                    isActive: true
                    createdById: "cmq6pppxs0000k8bdxllfuu7t"
                    createdAt: "2026-06-09T14:57:18.694Z"
                    updatedAt: "2026-06-09T14:57:18.694Z"
                error: null

    post:
      tags: [Working Shifts]
      summary: Create a working shift
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftDto"
            example:
              name: "Morning Shift"
              startTime: "08:00"
              endTime: "17:00"
              gracePeriodMinutes: 15
              gps:
                lat: 10.7769
                lng: 106.7009
                radiusMeters: 100
              isActive: true
      responses:
        "201":
          description: Shift created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/shifts/{id}:
    get:
      tags: [Working Shifts]
      summary: Get shift by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Working Shifts]
      summary: Update a working shift
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only. Send only fields to update.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftDto"
            example:
              gracePeriodMinutes: 10
      responses:
        "200":
          description: Shift updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Working Shifts]
      summary: Delete a working shift
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Shift deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    example: null
                  error:
                    nullable: true
                    example: null
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── SCHEDULES ───────────────────────────────────────────────

  /api/schedules/my:
    get:
      tags: [Schedules]
      summary: Get my schedule for today (or a specific date)
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
          example: "2026-06-10"
          description: Target date (defaults to today)
      responses:
        "200":
          description: Current schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
              example:
                data:
                  id: "cmq6sje8v0007f4eq0huthe0m"
                  employeeId: "cmq6pppxs0000k8bdxllfuu7t"
                  validFrom: "2026-06-01T00:00:00.000Z"
                  validTo: null
                  days:
                    - dayOfWeek: 1
                      shiftId: "cmq6shgpv0006f4eqeu867c34"
                      shift:
                        name: "Morning Shift"
                        startTime: 480
                        endTime: 1020
                error: null

  /api/schedules/my/all:
    get:
      tags: [Schedules]
      summary: List all my schedules
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"

  /api/schedules/employee/{employeeId}:
    get:
      tags: [Schedules]
      summary: Get an employee's schedule for a specific date
      parameters:
        - $ref: "#/components/parameters/EmployeeIdParam"
        - in: query
          name: date
          schema:
            type: string
            format: date
          example: "2026-06-10"
      responses:
        "200":
          description: Schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"

  /api/schedules/employee/{employeeId}/all:
    get:
      tags: [Schedules]
      summary: List all schedules for an employee
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only.
      parameters:
        - $ref: "#/components/parameters/EmployeeIdParam"
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"

  /api/schedules/assign:
    post:
      tags: [Schedules]
      summary: Assign a weekly schedule to an employee
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignScheduleDto"
            example:
              employeeId: "cmq6pppxs0000k8bdxllfuu7t"
              days:
                - dayOfWeek: 1
                  shiftId: "cmq6shgpv0006f4eqeu867c34"
                - dayOfWeek: 2
                  shiftId: "cmq6shgpv0006f4eqeu867c34"
                - dayOfWeek: 3
                  shiftId: "cmq6shgpv0006f4eqeu867c34"
                - dayOfWeek: 4
                  shiftId: "cmq6shgpv0006f4eqeu867c34"
                - dayOfWeek: 5
                  shiftId: "cmq6shgpv0006f4eqeu867c34"
              validFrom: "2026-06-01"
      responses:
        "201":
          description: Schedule assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/schedules/override:
    post:
      tags: [Schedules]
      summary: Override shift for a specific date
      description: ADMIN / HR_MANAGER / GENERAL_MANAGER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideShiftDto"
            example:
              employeeId: "cmq6pppxs0000k8bdxllfuu7t"
              shiftId: "cmq6shgpv0006f4eqeu867c34"
              assignedDate: "2026-06-10"
      responses:
        "201":
          description: Shift override applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"

  # ─── ATTENDANCE ──────────────────────────────────────────────

  /api/attendance:
    get:
      tags: [Attendance]
      summary: Query attendance records
      description: |
        - ADMIN / HR_MANAGER / GENERAL_MANAGER can view all records.
        - EMPLOYEE / TEAM_LEADER can only view their own records.
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          example: "2026-06-01"
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          example: "2026-06-09"
        - in: query
          name: employeeId
          schema:
            type: string
          description: Filter by employee (HR+ only)
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AttendanceStatus"
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"
              example:
                data:
                  - id: "cmq6pq0yd009ok8bdrl5hxiks"
                    employeeId: "cmq6pppxs0000k8bdxllfuu7t"
                    employeeShiftId: "cmq6ppz3w0058k8bd4savagqr"
                    date: "2026-06-08T00:00:00.000Z"
                    checkInAt: "2026-06-09T14:31:25.767Z"
                    checkInLat: 10.7769
                    checkInLng: 106.7009
                    checkOutAt: "2026-06-08T10:16:00.000Z"
                    status: "on_time"
                    lateMinutes: 0
                    earlyLeaveMinutes: 0
                    overtimeMinutes: 0
                    totalWorkMinutes: 540
                error: null

  /api/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check in
      description: Employee clocks in. A shift must be assigned for today.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationDto"
            example:
              location:
                lat: 10.7769
                lng: 106.7009
      responses:
        "200":
          description: Checked in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "400":
          description: No shift assigned for today or already checked in

  /api/attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check out
      description: Employee clocks out. Must have checked in first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationDto"
            example:
              location:
                lat: 10.7769
                lng: 106.7009
      responses:
        "200":
          description: Checked out successfully
        "400":
          description: Not checked in yet
        "409":
          description: Already checked out

  /api/attendance/scan:
    post:
      tags: [Attendance]
      summary: Auto scan (check-in or check-out)
      description: Auto-detects — checks in if not yet, checks out if already checked in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationDto"
            example:
              location:
                lat: 10.7769
                lng: 106.7009
      responses:
        "200":
          description: Action completed successfully

  # ─── SHIFT CHANGE REQUESTS ───────────────────────────────────

  /api/shift-change-requests:
    post:
      tags: [Shift Change Requests]
      summary: Submit a shift change request
      description: Employee requests to swap shifts with another employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitShiftChangeRequestDto"
            example:
              reason: "Need to swap shift due to family commitment"
              startDate: "2026-06-10"
              employeeShiftId: "cmq6ppz3w0058k8bd4savagqr"
              swapWithEmployeeId: "cmq6ppq1u0001k8bdfk1yr8hs"
              swapWithShiftId: "cmq6ppz3w005fk8bdmwngrwwh"
      responses:
        "201":
          description: Request submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
              example:
                data:
                  id: "cmq6tjajx000kf4eqhejjqkri"
                  type: "shift_swap"
                  status: "pending"
                  reason: "Need to swap shift due to family commitment"
                  startDate: "2026-06-10T00:00:00.000Z"
                  shiftSwapDetail:
                    employeeShiftId: "cmq6ppz3w0058k8bd4savagqr"
                    swapWithEmployeeId: "cmq6ppq1u0001k8bdfk1yr8hs"
                    swapWithShiftId: "cmq6ppz3w005fk8bdmwngrwwh"
                error: null
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/shift-change-requests/mine:
    get:
      tags: [Shift Change Requests]
      summary: List my shift change requests
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"

  # ─── APPROVALS ───────────────────────────────────────────────

  /api/approvals:
    get:
      tags: [Approvals]
      summary: List pending approvals
      description: Returns all pending requests the current user is authorized to approve.
      responses:
        "200":
          description: List of pending approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArray"

  /api/approvals/application/{id}:
    patch:
      tags: [Approvals]
      summary: Approve or reject a shift change request / application
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessApprovalDto"
            examples:
              approve:
                summary: Approve
                value:
                  status: "approved"
              reject:
                summary: Reject
                value:
                  status: "rejected"
                  rejectReason: "Does not meet shift swap requirements"
      responses:
        "200":
          description: Request processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseObject"
        "403":
          description: Not authorized to approve this request
        "404":
          $ref: "#/components/responses/NotFound"

# ─── COMPONENTS ──────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      example: "cmq6shgpv0006f4eqeu867c34"

    EmployeeIdParam:
      in: path
      name: employeeId
      required: true
      schema:
        type: string
      example: "cmq6pppxs0000k8bdxllfuu7t"

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponseObject:
      type: object
      properties:
        data:
          type: object
          nullable: true
        error:
          nullable: true
          type: object
          properties:
            message:
              type: string
            code:
              type: string

    ApiResponseArray:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        error:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
            meta:
              type: array
              items:
                type: object

    AttendanceStatus:
      type: string
      enum: [on_time, late, early_leave, absent, overtime]

    GpsDto:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          example: 10.7769
        lng:
          type: number
          minimum: -180
          maximum: 180
          example: 106.7009
        radiusMeters:
          type: number
          minimum: 10
          example: 100

    LocationDto:
      type: object
      required: [location]
      properties:
        location:
          $ref: "#/components/schemas/GpsDto"

    CreateShiftDto:
      type: object
      required: [name, startTime, endTime]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Morning Shift"
        startTime:
          type: string
          pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
        endTime:
          type: string
          pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
          example: "17:00"
        gracePeriodMinutes:
          type: integer
          minimum: 0
          default: 0
          example: 15
        gps:
          $ref: "#/components/schemas/GpsDto"
        isActive:
          type: boolean
          default: true

    UpdateShiftDto:
      type: object
      properties:
        name:
          type: string
        startTime:
          type: string
          example: "08:00"
        endTime:
          type: string
          example: "17:00"
        gracePeriodMinutes:
          type: integer
        gps:
          $ref: "#/components/schemas/GpsDto"
        isActive:
          type: boolean

    AssignScheduleDto:
      type: object
      required: [employeeId, days, validFrom]
      properties:
        employeeId:
          type: string
        days:
          type: array
          minItems: 1
          items:
            type: object
            required: [dayOfWeek, shiftId]
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
                description: "0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat"
              shiftId:
                type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true

    OverrideShiftDto:
      type: object
      required: [employeeId, shiftId, assignedDate]
      properties:
        employeeId:
          type: string
        shiftId:
          type: string
        assignedDate:
          type: string
          format: date

    SubmitShiftChangeRequestDto:
      type: object
      required: [reason, startDate, employeeShiftId, swapWithEmployeeId, swapWithShiftId]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        employeeShiftId:
          type: string
          description: EmployeeShift ID of the shift to swap from
        swapWithEmployeeId:
          type: string
          description: Employee ID of the person to swap with
        swapWithShiftId:
          type: string
          description: EmployeeShift ID of the target employee's shift
        workingShiftId:
          type: string
          description: WorkingShift template ID (optional)

    ProcessApprovalDto:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        rejectReason:
          type: string
          description: Required when status is rejected
