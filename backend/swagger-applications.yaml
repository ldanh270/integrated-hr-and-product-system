openapi: 3.0.0
info:
  title: HR Management System - Applications API
  description: API for managing employee applications (leave, overtime, work from home, etc.)
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - bearerAuth: []

paths:
  /api/applications:
    post:
      tags:
        - Applications
      summary: Submit a leave/overtime application
      description: Create a new application request (leave, overtime, work from home, shift swap, business trip, maternity, paternity, sick).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationDto"
      responses:
        "201":
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/Application"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/applications/employee/{employeeId}:
    get:
      tags:
        - Applications
      summary: Get employee applications
      description: Retrieve all applications for a specific employee with pagination and filters.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
          description: Employee ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
          description: Filter by application status
        - in: query
          name: type
          schema:
            type: string
            enum: [leave, overtime, work_from_home, shift_swap, business_trip, maternity, paternity, sick]
          description: Filter by application type
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
          description: Sort field
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        "200":
          description: List of applications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/PaginatedApplicationsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/applications/{id}:
    get:
      tags:
        - Applications
      summary: Get application details
      description: Retrieve detailed information about a specific application.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Application ID
      responses:
        "200":
          description: Application details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Applications
      summary: Update application
      description: Update an application (only if status is pending or by admin).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Application ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationDto"
      responses:
        "200":
          description: Application updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/Application"
        "400":
          description: Validation error or cannot update non-pending application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - only creator or admin can update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Applications
      summary: Cancel application
      description: Cancel an application (only if status is pending).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Application ID
      responses:
        "200":
          description: Application cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Application cancelled
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/applications/{id}/approve:
    patch:
      tags:
        - Applications
      summary: Approve or reject application
      description: Manager/Admin approves or rejects a pending application.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Application ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessApplicationDto"
      responses:
        "200":
          description: Application processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/Application"
        "400":
          description: Validation error or application already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/applications/stats/my:
    get:
      tags:
        - Applications
      summary: Get my application statistics
      description: Get statistics of my applications (pending, approved, rejected counts).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/ApplicationStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApplicationType:
      type: string
      enum:
        - leave
        - overtime
        - work_from_home
        - shift_swap
        - business_trip
        - maternity
        - paternity
        - sick
      description: Type of application request

    ApplicationStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
      description: Current status of the application

    RegimeType:
      type: string
      enum:
        - paid
        - unpaid
      description: Whether the absence is paid or unpaid

    CreateApplicationDto:
      type: object
      required:
        - type
        - startDate
        - endDate
        - reason
      properties:
        type:
          $ref: "#/components/schemas/ApplicationType"
        startDate:
          type: string
          format: date-time
          example: "2026-06-15T08:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2026-06-17T17:00:00Z"
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: "Health checkup appointment"
        employeeShiftId:
          type: string
          nullable: true
          description: Link to specific generated shift (optional)
        workingShiftId:
          type: string
          nullable: true
          description: Link to shift template (optional)
        regimeType:
          $ref: "#/components/schemas/RegimeType"
          nullable: true
          description: Paid or unpaid (default based on type)

    UpdateApplicationDto:
      type: object
      description: Update application (only allowed for pending status)
      properties:
        startDate:
          type: string
          format: date-time
          example: "2026-06-15T08:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2026-06-17T17:00:00Z"
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: "Updated reason"
        regimeType:
          $ref: "#/components/schemas/RegimeType"
          nullable: true

    ProcessApplicationDto:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
          example: approved
        rejectReason:
          type: string
          nullable: true
          maxLength: 500
          example: "Does not meet approval criteria"

    Application:
      type: object
      properties:
        id:
          type: string
          example: 6650a1b2c3d4e5f6a7b8c9d0
        employeeId:
          type: string
          example: 6650a1b2c3d4e5f6a7b8c9d1
        employeeName:
          type: string
          example: "Nguyễn Văn An"
        type:
          $ref: "#/components/schemas/ApplicationType"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        startDate:
          type: string
          format: date-time
          example: "2026-06-15T08:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2026-06-17T17:00:00Z"
        reason:
          type: string
          example: "Health checkup appointment"
        regimeType:
          $ref: "#/components/schemas/RegimeType"
          nullable: true
        employeeShiftId:
          type: string
          nullable: true
        workingShiftId:
          type: string
          nullable: true
        approvedBy:
          type: string
          nullable: true
          description: ID of approver (manager/admin)
        approverName:
          type: string
          nullable: true
          example: "Trần Thị Bình"
        rejectReason:
          type: string
          nullable: true
          example: "Does not meet approval criteria"
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedApplicationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 25
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 3

    ApplicationStats:
      type: object
      properties:
        pending:
          type: integer
          example: 2
        approved:
          type: integer
          example: 15
        rejected:
          type: integer
          example: 3
        cancelled:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Invalid application data
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string