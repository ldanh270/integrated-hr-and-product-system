name: 🔍 Pull Request Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build ${{ matrix.service }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: mcp
            context: ./mcp-server
            dockerfile: ./mcp-server/Dockerfile
          - service: gateway
            context: ./agent-gateway
            dockerfile: ./agent-gateway/Dockerfile

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: 🏗️ Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.service }}
