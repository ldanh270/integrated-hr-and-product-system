name: 🚀 Build & Deploy to EC2

on:
  push:
    branches:
      - main        # Production deploy
      - staging     # Staging deploy (optional)
  pull_request:
    branches:
      - main        # CI only — no deploy
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even without code changes"
        type: boolean
        default: false

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  # ============================================================
  # JOB 1: Build & Push Docker images to GHCR
  # ============================================================
  build:
    name: 🏗️ Build Images
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      # Self-hosted runners share the same workspace root; building these Docker
      # contexts in parallel can make one matrix job clean files while another
      # job is still calculating the build context.
      max-parallel: 1
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: hrp-backend
          - service: mcp
            context: ./mcp-server
            dockerfile: ./mcp-server/Dockerfile
            image: hrp-mcp
          - service: gateway
            context: ./agent-gateway
            dockerfile: ./agent-gateway/Dockerfile
            image: hrp-agent-gateway

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: 🧹 Free disk space on runner
        run: docker system prune -af --volumes || true

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and push — ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GHCR
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image }}:buildcache,mode=max

  # ============================================================
  # JOB 2: Deploy to EC2 (only on push to main)
  # ============================================================
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: 📦 Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: 📋 Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📁 Prepare deployment directory
        run: ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/hrp/nginx"

      - name: 📂 Copy compose files to EC2
        run: |
          scp docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/hrp/docker-compose.prod.yml
          scp -r nginx/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/hrp/nginx/

      - name: 🚀 Deploy on EC2
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.SHORT_SHA }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            cd ~/hrp

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            # Pull latest images
            echo "📥 Pulling images..."
            IMAGE_TAG=${{ steps.sha.outputs.SHORT_SHA }} \
            GITHUB_REPO=${{ github.repository }} \
            compose -f docker-compose.prod.yml pull

            # Run DB migrations (backend Prisma)
            echo "🗄️ Running DB migrations..."
            docker run --rm \
              --env-file ~/hrp/backend.env \
              ghcr.io/${{ github.repository }}/hrp-backend:${{ steps.sha.outputs.SHORT_SHA }} \
              sh -c "bunx prisma migrate deploy"

            # Rolling update — bring up new containers
            echo "♻️ Updating services..."
            IMAGE_TAG=${{ steps.sha.outputs.SHORT_SHA }} \
            GITHUB_REPO=${{ github.repository }} \
            compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health checks
            echo "🏥 Waiting for health checks..."
            sleep 15

            # Show running containers
            compose -f docker-compose.prod.yml ps

            # Prune old images
            docker image prune -f

            echo "✅ Deployment complete!"
          ENDSSH

      - name: 📣 Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to EC2 failed! Check the logs above."
          # Optional: add Telegram/Slack notification here
